{k:"use",q:"어떤 용도인가요?",o:[["그냥 먹을 용도","",{u:"eat"}],["선물용","크기와 외관이 좋은 것",{u:"gift"}],["아이 간식","작고 먹기 쉬운 것",{u:"kids"}],["요리·베이킹","열을 가해도 맛이 남는 것",{u:"cook"}]]}
];
var ans={},step=0;
var ROOT=document.getElementById("apk");var $=function(s){return ROOT.querySelector(s)};
function each(l,f){Array.prototype.forEach.call(l,f)}
function stars(v){return Math.round(v/5*100)+"%"}

function renderQ(){
  var el=$("#apk-quiz");
  if(step>=Q.length){return renderR(el)}
  var q=Q[step];
  var h='<div class="card"><div class="step">질문 '+(step+1)+' / '+Q.length+'</div><div class="bar" aria-hidden="true"><i style="width:'+(step/Q.length*100)+'%"></i></div><h2 style="margin-top:14px">'+q.q+'</h2><div class="opts">';
  q.o.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'">'+o[0]+(o[1]?'<small>'+o[1]+'</small>':'')+'</button>'});
  h+='</div>'+(step>0?'<button class="ghost" id="apk-back">이전 질문</button>':'')+'</div>';
  el.innerHTML=h;
  each(el.querySelectorAll(".opt"),function(b){b.onclick=function(){ans[q.k]=q.o[+b.dataset.i][2];step++;renderQ()}});
  var bk=$("#apk-back"); if(bk)bk.onclick=function(){step--;renderQ()};
}
function score(v){
  var s=0,m=[],a=ans;
  var t=a.taste; var tw=40;
  var d=(Math.abs(v.sw-t.sw)+Math.abs(v.so-t.so))/8; s+=tw*(1-d);
  s+= a.tex?15*(1-Math.abs(v.cr-a.tex.cr)/4):15*.7;
  s+= a.aro?15*(1-Math.abs(v.ar-a.aro.ar)/4):15*.7;
  if(a.sea===-1||a.sea===undefined) s+=20*.8; else s+=20*v.se[a.sea];
  s+= v.u.indexOf(a.use.u)>-1?10:(a.use.u==="eat"?6:0);
  return Math.round(s);
}
function renderR(el){
  var r=V.map(function(v){return{v:v,s:score(v)}}).sort(function(a,b){return b.s-a.s}).slice(0,3);
  var h='<div class="res"><div><h2>추천 품종 3가지</h2><p class="note" style="margin-top:4px">일치도는 답변과 품종 특성이 얼마나 가까운지 보여주는 점수입니다.</p></div>';
  r.forEach(function(x,i){
    var v=x.v,seasonOk=(ans.sea===-1||ans.sea===undefined||v.se[ans.sea]>0);
    h+='<div class="card"><div class="hd">'+pic(v,84)+'<div class="hdt"><div class="rank"><h3>'+(i+1)+'. '+v.n+'</h3><span class="score">일치도 '+x.s+'%</span></div>'
    +'<div class="tags"><span class="tag">'+v.o+'</span><span class="tag">수확 '+v.h+'</span>'+(v.br?'<span class="tag">당도 '+v.br+' Bx</span>':'')+(v.ta?'<span class="tag">산도 '+v.ta+'%</span>':'')
    +(seasonOk?'':'<span class="tag warn">고른 시기에는 구하기 어려울 수 있음</span>')+'</div>'
    +'</div></div><p class="why">'+v.t+'</p>'
    +'<div class="map"><span>단맛</span><div class="bar"><i class="s" style="width:'+stars(v.sw)+'"></i></div><span>신맛</span><div class="bar"><i style="width:'+stars(v.so)+'"></i></div><span>아삭함</span><div class="bar"><i style="width:'+stars(v.cr)+'"></i></div><span>향</span><div class="bar"><i class="a" style="width:'+stars(v.ar)+'"></i></div></div>'
    +'<p class="note" style="margin-top:10px">'+v.e+'</p></div>';
  });
  h+='<div><button class="primary" id="apk-redo">다시 해보기</button></div></div>';
  el.innerHTML=h; $("#apk-redo").onclick=function(){ans={};step=0;renderQ()};
}

/* 도감 */
var sf=-1;
function renderList(){
  var chips=[["전체",-1],["8월~9월 초",0],["9월 중순~10월",1],["11월 이후",2]];
  $("#apk-seasonChips").innerHTML=chips.map(function(c){return '<button class="chip" aria-pressed="'+(sf===c[1])+'" data-s="'+c[1]+'">'+c[0]+'</button>'}).join("");
  each(ROOT.querySelectorAll("#apk-seasonChips .chip"),function(b){b.onclick=function(){sf=+b.dataset.s;renderList()}});
  var rows=V.filter(function(v){return sf<0||v.se[sf]>0});
  $("#apk-tbl").innerHTML='<thead><tr><th>품종</th><th>수확</th><th>당도(Bx)</th><th>산도(%)</th><th>맛·식감</th></tr></thead><tbody>'+rows.map(function(v){return '<tr><td><div class="thumb">'+pic(v,40)+'<div><b>'+v.n+'</b><br><span class="note">'+v.o+'</span></div></div></td><td>'+v.h+'</td><td class="n">'+(v.br||"-")+'</td><td class="n">'+(v.ta||"-")+'</td><td>'+v.t+'</td></tr>'}).join("")+'</tbody>';
}

/* 성분 */
function renderSci(){
  $("#apk-sciBody").innerHTML=
'<div class="card"><h2>맛은 무엇으로 정해지나</h2><ul class="plain">'
+'<li><b>단맛·신맛</b>은 당류(과당, 포도당, 자당, 소르비톨)와 유기산(주로 사과산)의 양과 비율에서 나옵니다. 한국산 사과 유기산의 약 95%가 사과산입니다.</li>'
+'<li><b>사과향·과일향</b>은 에스터류가 만듭니다. 한국 품종 연구에서 hexyl acetate, 2-methylbutyl acetate 등이 사과향·과일향과 연결됐고, 감홍과 후지에 많았습니다.</li>'
+'<li><b>풋내·오이향</b>은 일부 알데하이드가 만듭니다. 홍로에서만 검출된 (E)-2-nonenal이 오이향과 낮은 선호도에 연결됐습니다.</li>'
+'<li><b>향은 품종마다 다릅니다.</b> 2-methylbutyl acetate는 후지의 대표 향 성분으로 보고됩니다. 같은 품종도 고도, 숙도에 따라 달라집니다.</li></ul></div>'
+'<div class="card"><h2>국내 주요 4품종 측정 비교</h2><p class="note" style="margin:6px 0 10px">안동대 연구(2023), 경북 재배, 2020·2021년 평균. 소비자 100명 평가(2021).</p><div class="tblwrap" style="border:0"><table style="min-width:480px"><thead><tr><th>품종</th><th>당도(Bx)</th><th>산도(%)</th><th>전체 선호도</th><th>단맛 점수</th></tr></thead><tbody>'
+'<tr><td>감홍</td><td class="n">15.26</td><td class="n">0.22</td><td class="n">50.5</td><td class="n">45.6</td></tr>'
+'<tr><td>후지</td><td class="n">14.24</td><td class="n">0.26</td><td class="n">52.5</td><td class="n">49.1</td></tr>'
+'<tr><td>양광</td><td class="n">13.37</td><td class="n">0.25</td><td class="n">31.7</td><td class="n">29.7</td></tr>'
+'<tr><td>홍로</td><td class="n">12.44</td><td class="n">0.21</td><td class="n">26.8</td><td class="n">32.9</td></tr></tbody></table></div>'
+'<p class="note" style="margin-top:8px">당도만으로 선호도가 정해지지는 않습니다. 후지는 당산비가 감홍보다 낮은데도 선호도가 비슷했고, 연구진은 향 성분 차이를 이유로 봅니다. 시료는 9~11월 수확 직후 상태이며 저장 후에는 달라질 수 있습니다.</p></div>'
+'<div class="card"><h2>참고한 논문</h2><div class="paper" style="margin-top:10px">'
+'<div>Kim K. 외, Relationships between sensory properties and metabolomic profiles of different apple cultivars, <i>Food Chemistry: X</i> 18 (2023)<br><a href="https://doi.org/10.1016/j.fochx.2023.100641" target="_blank" rel="noopener">doi.org/10.1016/j.fochx.2023.100641</a></div>'
+'<div>Kim K. 외, Antioxidant and flavor properties of different apple cultivars grown in Korea, <i>Food Chemistry: X</i> 32 (2025). 홍로·피크닉·이지플·황옥·후지는 항산화 활성이 높고, 아리수·아리원은 낮았습니다. 아리수·아리원은 단맛·신맛·과일향 점수와 선호도가 높았습니다.<br><a href="https://www.sciencedirect.com/science/article/pii/S2590157525011101" target="_blank" rel="noopener">sciencedirect.com/science/article/pii/S2590157525011101</a></div>'
+'<div>Molecules 25(13):3007 (2020), 11개 품종 향 성분과 관능평가. 입안 느낌은 당·유기산, 향은 휘발성 성분이 좌우합니다.<br><a href="https://doi.org/10.3390/molecules25133007" target="_blank" rel="noopener">doi.org/10.3390/molecules25133007</a></div>'
+'<div>Foods 10(5):1051 (2021), 40개 품종 껍질 휘발성 성분 분석.<br><a href="https://doi.org/10.3390/foods10051051" target="_blank" rel="noopener">doi.org/10.3390/foods10051051</a></div>'
+'<div>Antioxidants 9(5):443 (2020), 신품종 10종과 전통 품종 14종의 당·유기산·페놀 분석.<br><a href="https://doi.org/10.3390/antiox9050443" target="_blank" rel="noopener">doi.org/10.3390/antiox9050443</a></div>'
+'<div>도영숙 외, 우리나라 사과 일부 품종의 유기산 함량, 한국식품과학회지 (2005). 홍옥 630.8, 신흥 471.0, 후지 403.8, 쓰가루 364.2 mg%.<br><a href="https://www.koreascience.or.kr/article/JAKO200504637355510.page" target="_blank" rel="noopener">koreascience.or.kr/article/JAKO200504637355510.page</a></div>'
+'</div></div>'
+'<div class="card"><h2>수입 사과는요</h2><p style="margin-top:6px">미국, 일본, 뉴질랜드 등 11개국이 수입위험분석을 요청했지만 사과는 아직 수입이 허용되지 않았습니다. 이 도구는 국내산과 국내에서 재배되는 도입 품종만 다룹니다.</p></div>';
}

each(ROOT.querySelectorAll("nav button"),function(b){b.onclick=function(){
  each(ROOT.querySelectorAll("nav button"),function(x){x.setAttribute("aria-selected",x===b)});
  ["quiz","list","sci"].forEach(function(id){$("#apk-"+id).hidden=(id!==b.dataset.tab)});
}});
try{renderQ();renderList();renderSci();}catch(e){var qq=document.getElementById("apk-quiz");if(qq)qq.innerHTML='<div class="card"><p>퀴즈를 불러오지 못했습니다. Safari나 Chrome 앱에서 열어주세요.</p><p class="note">오류: '+String(e&&e.message||e)+'</p></div>'}
</script>
